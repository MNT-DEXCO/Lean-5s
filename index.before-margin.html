function printCurrent(){const svg=mode==='e1'||mode==='e2'?labelsSvg(mode):mode==='temp'?tempSvg():areaSvg();const landscape=mode!=='temp';const win=window.open('','_blank');if(!win){toast('Permita pop-ups para gerar a impressão.');return}win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Impressão 5S</title><style>@page{size:${landscape?'A4 landscape':'A4 portrait'};margin:0}html,body{margin:0;padding:0;background:white}svg{display:block;width:100%;height:auto}@media print{svg{width:100%;height:auto}}</style></head><body>${svg}<script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);win.document.close()}
